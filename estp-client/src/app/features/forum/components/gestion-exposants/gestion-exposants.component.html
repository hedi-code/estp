<div class="p-5">
    <h1 class="text-blue-400 pb-3">Gestion des Exposants</h1>

    <div class="flex justify-content-between align-items-center mb-4">
        <div class="flex gap-2">
            <span class="p-input-icon-left w-full">
                <i class="pi pi-search"></i>
                <input type="text" pInputText placeholder="Rechercher un exposant ou une entreprise..."
                       [(ngModel)]="searchText" (input)="applyFilter()" class="w-full" style="width: 400px;" />
            </span>
        </div>
        <button pButton type="button" label="Ajouter un exposant" icon="pi pi-plus"
                class="p-button-primary" (click)="openCreateDialog()"></button>
    </div>

    <div class="mb-3 text-600">
        <strong>Total:</strong> {{ filteredExposants.length }} exposant(s)
    </div>

    <p-accordion *ngIf="getEntrepriseKeys().length > 0" [multiple]="true">
        <p-accordionTab *ngFor="let entrepriseName of getEntrepriseKeys()" [header]="entrepriseName + ' (' + groupedExposants[entrepriseName].length + ')'">
            <p-table [value]="groupedExposants[entrepriseName]" [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Fonction</th>
                       
                        <th style="width: 150px;">Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-exposant>
                    <tr>
                        <td>{{ exposant.nom }}</td>
                        <td>{{ exposant.prenom }}</td>
                        <td>{{ exposant.fonction }}</td>
                       
                        <td>
                            <!-- <button pButton type="button" icon="pi pi-pencil"
                                    class="p-button-rounded p-button-text p-button-warning mr-2"
                                    pTooltip="Modifier"
                                    (click)="openEditDialog(exposant)"></button> -->
                            <button pButton type="button" icon="pi pi-trash"
                                    class="p-button-rounded p-button-text p-button-danger"
                                    pTooltip="Supprimer"
                                    (click)="deleteExposant(exposant)"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </p-accordionTab>
    </p-accordion>

    <div *ngIf="getEntrepriseKeys().length === 0" class="text-center py-5 text-500">
        <i class="pi pi-inbox" style="font-size: 3rem;"></i>
        <p class="mt-3">Aucun exposant trouvé.</p>
    </div>
</div>

<!-- Dialog for Create/Edit Exposant -->
<p-dialog [(visible)]="showDialog" [header]="isEditMode ? 'Modifier un exposant' : 'Ajouter un exposant'"
          [modal]="true" [style]="{width: '450px'}" [draggable]="false" [resizable]="false">
    <div class="flex flex-column gap-3">
        <div>
            <label for="entreprise_id" class="block mb-2">ID Entreprise <span class="text-red-500">*</span></label>
            <input id="entreprise_id" type="number" pInputText [(ngModel)]="currentExposant.entreprise_id"
                   class="w-full" placeholder="ID de l'entreprise" />
        </div>
        <div>
            <label for="nom" class="block mb-2">Nom <span class="text-red-500">*</span></label>
            <input id="nom" type="text" pInputText [(ngModel)]="currentExposant.nom"
                   class="w-full" placeholder="Nom" />
        </div>
        <div>
            <label for="prenom" class="block mb-2">Prénom <span class="text-red-500">*</span></label>
            <input id="prenom" type="text" pInputText [(ngModel)]="currentExposant.prenom"
                   class="w-full" placeholder="Prénom" />
        </div>
        <div>
            <label for="fonction" class="block mb-2">Fonction <span class="text-red-500">*</span></label>
            <input id="fonction" type="text" pInputText [(ngModel)]="currentExposant.fonction"
                   class="w-full" placeholder="Fonction" />
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button pButton type="button" label="Annuler" icon="pi pi-times"
                class="p-button-text" (click)="closeDialog()"></button>
        <button pButton type="button" label="Enregistrer" icon="pi pi-check"
                [disabled]="!currentExposant.entreprise_id || !currentExposant.nom || !currentExposant.prenom || !currentExposant.fonction"
                (click)="saveExposant()"></button>
    </ng-template>
</p-dialog>

<p-confirmDialog></p-confirmDialog>
